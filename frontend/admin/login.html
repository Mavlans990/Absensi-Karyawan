<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Administrator — Aplikasi Absensi Karyawan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/tailwind.css" />
</head>
<body class="min-h-screen bg-slate-50 text-[#0F172A] flex flex-col justify-between">

  <main class="flex flex-1 items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <!-- Kartu Identitas Aplikasi -->
      <div class="mb-7 text-center">
        <div class="mx-auto mb-3.5 flex h-12 w-12 items-center justify-center rounded-2xl bg-[#1D4ED8] text-white shadow-md shadow-blue-600/20">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-[#0F172A]">Portal Administrator</h1>
        <p class="mt-1 text-sm text-slate-500">
          Masuk untuk memantau riwayat absensi &amp; mengelola data karyawan
        </p>
      </div>

      <!-- Kartu Login -->
      <div class="stitch-card p-6 sm:p-8">
        <form id="admin-login-form" class="space-y-5" novalidate>
          <div>
            <label for="username" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-slate-600">
              Username Admin
            </label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="Masukkan username admin"
              required
              class="stitch-input"
              value="admin"
            />
          </div>

          <div>
            <label for="password" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-slate-600">
              Kata Sandi
            </label>
            <div class="relative">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Masukkan kata sandi"
                required
                class="stitch-input pr-11"
                value="Admin123!"
              />
              <button
                type="button"
                id="btn-toggle-password"
                aria-label="Tampilkan kata sandi"
                class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1 text-slate-400 hover:text-slate-600"
              >
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <div
            id="login-error-alert"
            class="hidden rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700 flex items-start gap-2.5"
          >
            <svg class="h-5 w-5 shrink-0 text-rose-500 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z" />
            </svg>
            <span id="login-error-text"></span>
          </div>

          <button
            type="submit"
            id="btn-login-submit"
            class="stitch-btn-primary w-full py-3.5 text-sm font-bold"
          >
            <span id="btn-login-label">Masuk ke Dashboard</span>
          </button>
        </form>

        <div class="mt-6 border-t border-slate-100 pt-4 text-center">
          <a
            href="/user/index.html"
            class="inline-flex items-center gap-1.5 text-xs font-semibold text-[#1D4ED8] hover:underline"
          >
            &larr; Kembali ke Halaman Absensi Karyawan
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400">
    Aplikasi Absensi Karyawan &bull; Autentikasi Terproteksi JWT
  </footer>

  <script src="/public/js/api.js"></script>
  <script src="/public/js/admin-login.js"></script>
</body>
</html>
